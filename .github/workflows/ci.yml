name: CI

# Branch pushes run through their pull request; a push trigger on every branch would run
# everything twice. A branch without a pull request can be checked with a manual run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI only needs pass/fail, and it makes linking faster and the caches smaller.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_DENY_VERSION: 0.20.2

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the end-to-end relay tests on loopback (tests/relay.rs).
      - name: Rust tests
        run: cargo test --locked

  # The image must start as non-root, print its fingerprint and answer /v1/status with the
  # secret (spec AC-4.25).
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mumpeer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Status check
        run: scripts/ci/image-check.sh mumpeer:ci

      # The release workflow runs this script only on a tag; run it here so it cannot break
      # unnoticed. The image built above stands in for the released one (amd64 only).
      - name: Read tool versions
        id: tools
        run: grep '^[A-Z_]*=' scripts/tools.env >> "$GITHUB_OUTPUT"

      - id: cyclonedx
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.CARGO_CYCLONEDX_VERSION }}

      - name: Install cargo-cyclonedx
        if: steps.cyclonedx.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.tools.outputs.CARGO_CYCLONEDX_VERSION }}
        run: cargo install cargo-cyclonedx --version "$VERSION" --locked

      - name: Generate SBOMs
        run: |
          scripts/generate-sbom.sh 0.0.0 sbom
          ARCHS=x86_64 scripts/generate-sbom.sh 0.0.0 sbom mumpeer:ci
          ls -l sbom

  deny:
    name: Dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo-deny
        id: deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: Advisories, licences, bans and sources
        run: cargo deny check
