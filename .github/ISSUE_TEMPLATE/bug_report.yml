name: Bug report
description: Something in mumpeer doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never post the API secret, pair tokens, the relay key or certificates and private keys.
        Remove every secret and every full IP address from the config and the logs before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start mumpeer with …
        2. Connect from …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mumpeer version
      description: Output of `mumpeer --version`
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - QUIC (UDP) transport
        - TLS (TCP) transport
        - Allowlist API
        - Limits
        - Config and startup
        - Docker image
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: How do you run it? Binary and OS, or Docker image tag
      placeholder: "Binary on Debian 12, or ghcr.io/mumcord/mumpeer:0.2.1"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: |
        Paste your config. **Remove all secrets first: no API secret, relay key or certificates.**
        Replace them with placeholders such as `REDACTED`.
      render: toml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove anything private first.
      render: text
