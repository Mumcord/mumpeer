<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">mumpeer social preview</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160a3d"/>
      <stop offset="1" stop-color="#2a1478"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
  </defs>
  <style>text { font-family: 'Noto Sans', ui-sans-serif, system-ui, sans-serif; }</style>
  <rect width="1280" height="640" fill="url(#page)"/>
  <g transform="translate(120 160) scale(0.625)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1478"/>
      <stop offset="1" stop-color="#140a3a"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="432" y2="0">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The direct path between the peers, blocked by NAT or a firewall. -->
  <line x1="176" y1="340" x2="336" y2="340" stroke="#ffffff" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <!-- The relayed path over the bridge. -->
  <path d="M120 340 C120 210 176 196 256 196 C336 196 392 210 392 340" fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="160" cy="218" r="9" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="352" cy="218" r="9" fill="#ffffff" fill-opacity="0.9"/>
  <!-- The peers. -->
  <circle cx="120" cy="352" r="50" fill="#ff9a8b"/>
  <circle cx="392" cy="352" r="50" fill="#8b6cff"/>
  <!-- The relay: it forwards, but the lock stays with the peers. -->
  <circle cx="256" cy="196" r="76" fill="#ffffff"/>
  <circle cx="256" cy="196" r="76" fill="none" stroke="url(#accent)" stroke-width="10"/>
  <path d="M234 190 v-18 a22 22 0 0 1 44 0 v18" fill="none" stroke="#1d0f5c" stroke-width="13" stroke-linecap="round"/>
  <rect x="220" y="186" width="72" height="54" rx="12" fill="#1d0f5c"/>
  <circle cx="256" cy="207" r="8" fill="#ffffff"/>
  <rect x="252" y="207" width="8" height="18" rx="4" fill="#ffffff"/>
  </g>
  <text x="510" y="290" fill="#ffffff" font-size="120" font-weight="700" letter-spacing="-3">mumpeer</text>
  <rect x="516" y="322" width="140" height="8" rx="4" fill="url(#rule)"/>
  <text x="514" y="390" fill="#cfc6f5" font-size="36">Relay for Mumcord's peer-to-peer features</text>
  <text x="514" y="446" fill="#a99fd6" font-size="24">End-to-end encrypted · works through NAT and CGNAT · hides IPs</text>
  <text x="120" y="580" fill="#8a80b8" font-size="24">github.com/Mumcord/mumpeer</text>
</svg>
